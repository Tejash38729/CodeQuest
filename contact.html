<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with the CodeQuest team for questions, feedback, or quiz topic suggestions.">
    <meta name="keywords" content="contact codequest, support, feedback">
    <title>Contact Us - CodeQuest Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: #1e293b; padding: 1.2rem 2rem; border-bottom: 2px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; font-weight: 500; }
        nav a:hover, nav a.active { color: #38bdf8; }
        .container { max-width: 700px; margin: 2.5rem auto; padding: 0 1rem; }
        h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 0.5rem; text-align: center; }
        .subtitle { color: #94a3b8; text-align: center; margin-bottom: 2rem; }
        form { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; color: #cbd5e1; margin-bottom: 0.5rem; font-size: 0.95rem; }
        input, textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; color: #fff; }
        footer { text-align: center; padding: 2rem; background: #0b1120; color: #64748b; margin-top: 3rem; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ CodeQuest</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container">
        <h1>Get in Touch</h1>
        <p class="subtitle">Have questions or want to suggest new quiz questions? Drop a message!</p>

        <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Tejash Choudhary" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>
            <div class="form-group">
                <label for="message">Message / Suggestion</label>
                <textarea id="message" rows="4" placeholder="I'd love to see a quiz on JavaScript loops!" required></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CodeQuest Platform. Designed for Class 12 Science IT Practical Work.</p>
    </footer>

</body>
</html>
