<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Chuchu Bird online with custom skin uploads, dynamic physics, and retro arcade sounds. Built by Tejash.">
    <meta name="keywords" content="chuchu bird, flappy bird online, custom flappy bird, web game, tejash">
    <meta name="author" content="Tejash">
    <title>Chuchu Bird - Aesthetic Web Arcade Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(244, 114, 182, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand { display: flex; flex-direction: column; }
        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(90deg, #f472b6, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .caption { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; font-weight: 600; transition: 0.2s; }
        nav a:hover, nav a.active { color: #f472b6; }
        
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
        .game-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            padding: 1.2rem;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(244, 114, 182, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        canvas {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }
        .controls-bar {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            align-items: center;
        }
        .upload-btn, .action-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .upload-btn:hover, .action-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); }
        input[type="file"] { display: none; }
        .hud-text { font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem; }
        footer { text-align: center; padding: 1.2rem; background: rgba(10, 14, 39, 0.9); color: #64748b; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="logo">🐦 Chuchu Bird</span>
            <span class="caption">Made By Tejash</span>
        </div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="ideas.html">Your Ideas</a>
        </nav>
    </header>

    <main>
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="360" height="520"></canvas>
            
            <div class="controls-bar">
                <label class="upload-btn">
                    📷 Custom Skin
                    <input type="file" id="skinInput" accept="image/*">
                </label>
                <button class="action-btn" id="resetSkinBtn">Reset Default</button>
            </div>
            <p class="hud-text">Tap canvas or press <b>SPACE</b> / <b>CLICK</b> to Fly & Start</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Chuchu Bird Arcade. Developed with HTML5 Canvas & Web Audio API by Tejash.</p>
    </footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Audio synthesizer using Web Audio API (No external sound files required)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        const sfx = {
            jump: () => playTone(400, 'sine', 0.15),
            score: () => playTone(650, 'triangle', 0.2),
            hit: () => playTone(120, 'sawtooth', 0.3)
        };

        // Game Physics & State
        let gameState = 'START'; // START, PLAY, GAMEOVER
        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem("chuchu_high") || 0;

        let bird = {
            x: 60,
            y: 220,
            radius: 16,
            velocity: 0,
            gravity: 0.28,
            jump: -5.8,
            customImg: null
        };

        let pipes = [];
        const pipeWidth = 52;
        const pipeGap = 130;

        // Custom Skin Handlers
        document.getElementById('skinInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = () => { bird.customImg = img; };
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('resetSkinBtn').addEventListener('click', () => {
            bird.customImg = null;
            document.getElementById('skinInput').value = '';
        });

        function resetGame() {
            bird.y = 220;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frames = 0;
            gameState = 'PLAY';
        }

        function flap() {
            if (gameState === 'START') {
                resetGame();
                sfx.jump();
            } else if (gameState === 'PLAY') {
                bird.velocity = bird.jump;
                sfx.jump();
            } else if (gameState === 'GAMEOVER') {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') flap(); });
        canvas.addEventListener('pointerdown', flap);

        // Game Engine Loop
        function loop() {
            update();
            render();
            frames++;
            requestAnimationFrame(loop);
        }

        function update() {
            if (gameState !== 'PLAY') return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Floor & Ceiling bounds
            if (bird.y + bird.radius >= canvas.height - 20) {
                sfx.hit();
                triggerGameOver();
            }
            if (bird.y - bird.radius <= 0) bird.y = bird.radius;

            // Pipe spawning
            if (frames % 100 === 0) {
                let maxTop = canvas.height - pipeGap - 80;
                let topH = Math.floor(Math.random() * (maxTop - 50)) + 50;
                pipes.push({ x: canvas.width, top: topH, passed: false });
            }

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= 2;

                // Collision detection
                let birdRight = bird.x + bird.radius;
                let birdLeft = bird.x - bird.radius;
                let birdTop = bird.y - bird.radius;
                let birdBottom = bird.y + bird.radius;

                let bottomPipeY = p.top + pipeGap;

                if (birdRight > p.x && birdLeft < p.x + pipeWidth) {
                    if (birdTop < p.top || birdBottom > bottomPipeY) {
                        sfx.hit();
                        triggerGameOver();
                    }
                }

                if (!p.passed && p.x + pipeWidth < bird.x) {
                    score++;
                    p.passed = true;
                    sfx.score();
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("chuchu_high", highScore);
                    }
                }
            }

            pipes = pipes.filter(p => p.x + pipeWidth > 0);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Aesthetic Stars / Background grid
            ctx.fillStyle = "rgba(244, 114, 182, 0.1)";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Draw Pipes
            for (let p of pipes) {
                let grad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
                grad.addColorStop(0, "#06b6d4");
                grad.addColorStop(1, "#3b82f6");

                ctx.fillStyle = grad;
                ctx.shadowColor = "#06b6d4";
                ctx.shadowBlur = 10;
                // Top pipe
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                // Bottom pipe
                ctx.fillRect(p.x, p.top + pipeGap, pipeWidth, canvas.height - (p.top + pipeGap) - 20);
                ctx.shadowBlur = 0;
            }

            // Draw Bird / Skin
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 4) * Math.PI / 180)));

            if (bird.customImg) {
                ctx.beginPath();
                ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(bird.customImg, -bird.radius, -bird.radius, bird.radius * 2, bird.radius * 2);
            } else {
                // Default Chuchu Bird (Aesthetic Neon Chick)
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath();
                ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = "#0f172a";
                ctx.beginPath();
                ctx.arc(6, -4, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = "#f97316";
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(20, 4);
                ctx.lineTo(10, 8);
                ctx.fill();
            }
            ctx.restore();

            // UI Overlays
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";

            if (gameState === 'START') {
                ctx.fillText("🐦 CHUCHU BIRD", canvas.width / 2, 170);
                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#94a3b8";
                ctx.fillText("TAP OR PRESS SPACE TO FLY", canvas.width / 2, 210);
            } else if (gameState === 'PLAY') {
                ctx.fillText(score, canvas.width / 2, 50);
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = "#f43f5e";
                ctx.fillText("GAME OVER", canvas.width / 2, 180);
                ctx.fillStyle = "#f8fafc";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Score: " + score, canvas.width / 2, 220);
                ctx.fillText("Best: " + highScore, canvas.width / 2, 250);
                ctx.font = "13px 'Segoe UI'";
                ctx.fillStyle = "#94a3b8";
                ctx.fillText("TAP TO RETRY", canvas.width / 2, 290);
            }
        }

        loop();
    </script>
</body>
</html>
